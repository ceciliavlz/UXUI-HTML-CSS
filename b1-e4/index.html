<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

  <main class="area-main">
    <div id="main-header">
      <h1>Nueva Publicación</h1>
      <p>Subí los datos de tu perrito para incluirlo en la comunidad</p>
    </div>

    <!-- FORMULARIO DE NUEVA PUBLICACIÓN (PÁGINA EXCLUSIVA) -->
    <section class="form-section">
      <h2> Datos del Perrito</h2>
      
      <form action="#" method="POST" class="post-form">
        
        <div class="form-group">
          <label for="dog-name">Nombre del perrito:</label>
          <input type="text" id="dog-name" name="dog_name" placeholder="Ej: Firulais" required>
        </div>

        <div class="form-group">
          <label for="dog-breed">Raza:</label>
          <input type="text" id="dog-breed" name="dog_breed" placeholder="Ej: Beagle, Mestizo..." required>
        </div>

        <div class="form-group">
          <label for="dog-age">Edad (años):</label>
          <input type="number" id="dog-age" name="dog_age" min="0" max="30" placeholder="Ej: 3" required>
        </div>

        <div class="form-group">
          <label for="dog-image">URL de la imagen:</label>
          <input type="url" id="dog-image" name="dog_image" placeholder="https://ejemplo.com/foto.jpg" required>
        </div>

        <div class="form-group full-width">
          <label for="dog-description">Descripción o historia:</label>
          <textarea id="dog-description" name="dog_description" rows="5" placeholder="Contanos algo divertido sobre tu perrito..." required></textarea>
        </div>

        <div class="form-group full-width">
          <button type="submit" class="btn-submit">Publicar Perrito</button>
        </div>

      </form>
    </section>
  </main>

</body>
</html>
