<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Perritos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Selector de ID: #main-header -->
    <div id="main-header">
        <h1>Galería de Perritos</h1>
        <p>Compartí con el mundo las fotos de tus mejores amigos</p>
    </div>

  <!-- Contenedor principal -->
    <div class="container">

        <!-- Card 1 -->
        <div class="card">
            <img src="https://cdn-v2.meme.com/memes/dog-with-apple-apple-dog/dog-with-apple-apple-dog-beagle-apple-alternate-angle.webp" alt="Perrito Dachshund">
            <h2>Apple</h2>
            <p>Raza: <span>Dachshund</span></p>
            <p>Apple encontró unas manzanas.</p>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQg6Lt6kW01yz1UZqOqxKc0sMqVfeNTIufMwm4F1geYVbNCiWMU" alt="Perrito Dalmata">
            <h2>Noé</h2>
            <p>Raza: <span>Dalmata</span></p>
            <p>El rey del camuflaje.</p>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://i.pinimg.com/736x/83/10/6b/83106b4d46f497a9a73eae1ba78e6682.jpg" alt="Perrito negro">
            <h2>Rocky</h2>
            <p>Raza: <span>Perrito chiquito</span></p>
            <p>Rocky comprobando cuánto creció este mes</p>
        </div>

    </div>

</body>
</html>
