  <text x="940" y="664" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CONFIRMAR PEDIDO</text>
  <text x="814" y="702" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="8">Sin cuenta obligatoria · 3 pasos · retiro programado</text>

  <text x="70" y="840" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.5">DECISIONES: PRODUCTO AL FRENTE · PERSONALIZACIÓN EN CONTEXTO · RETIRO VISIBLE · CHECKOUT SIN FRICCIÓN</text>
  <text x="70" y="866" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1">BAJA FIDELIDAD · ESTRUCTURA Y JERARQUÍA ANTES DEL COLOR</text>
