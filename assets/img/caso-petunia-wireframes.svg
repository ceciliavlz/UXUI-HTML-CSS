  <circle cx="580" cy="404" r="58" fill="#F2D08A" opacity=".7"/>
  <path d="M548 414c14-10 28-10 42 0s28 10 42 0" stroke="#B23A6B" stroke-width="7" stroke-linecap="round" opacity=".5"/>
