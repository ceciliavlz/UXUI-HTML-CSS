  <rect x="946" y="582" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#E8D9D5"/>
  <text x="1006" y="603" text-anchor="middle" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="8">TRANSFERENCIA</text>
