  <rect x="814" y="468" width="252" height="34" rx="10" fill="#FFFFFF" stroke="#E8D9D5"/>
  <rect x="826" y="481" width="92" height="7" rx="3.5" fill="#2E2430" opacity=".18"/>
  <rect x="814" y="512" width="252" height="34" rx="10" fill="#FFFFFF" stroke="#E8D9D5"/>
