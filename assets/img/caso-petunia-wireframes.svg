<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Casa Petunia — Wireframes mobile first</title>
  <desc id="desc">Tres wireframes de baja fidelidad para las pantallas de inicio, producto y checkout, con anotaciones de decisiones de jerarquía y flujo.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#84264D" flood-opacity=".1"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#FDF8F5"/>
  <text x="70" y="76" fill="#B23A6B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">CASA PETUNIA / ARQUITECTURA</text>
  <text x="70" y="132" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="-1.5">Wireframes / mobile first</text>
  <text x="70" y="162" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="14">Primero la jerarquía, después el color. Tres pantallas clave del flujo de compra.</text>

