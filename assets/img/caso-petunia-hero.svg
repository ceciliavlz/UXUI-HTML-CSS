<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Casa Petunia — Caso de estudio</title>
  <desc id="desc">Composición editorial del caso Casa Petunia con una pantalla de escritorio de la tienda, una pantalla móvil y una ilustración de pastel sobre fondo blush.</desc>
