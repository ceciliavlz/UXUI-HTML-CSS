<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Casa Petunia — Research y benchmark</title>
  <desc id="desc">Tablero de investigación con tres referencias de e-commerce, tres insights de entrevistas y una persona usuaria resumida.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#84264D" flood-opacity=".1"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#FDF8F5"/>
  <text x="70" y="76" fill="#B23A6B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">CASA PETUNIA / RESEARCH</text>
  <text x="70" y="132" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="-1.5">Research &amp; benchmark</text>
  <text x="70" y="162" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="14">5 entrevistas, 3 comercios de referencia y una pregunta: ¿qué hace que una compra artesanal se sienta confiable?</text>

  <text x="70" y="214" fill="#84264D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2">BENCHMARK</text>

  <g filter="url(#shadow)">
    <rect x="70" y="236" width="250" height="176" rx="20" fill="#FFF8F0" stroke="#E8D9D5"/>
  </g>
  <rect x="88" y="254" width="42" height="42" rx="12" fill="#F2D08A"/>
  <text x="109" y="281" text-anchor="middle" fill="#84264D" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">M</text>
  <text x="144" y="270" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700">Milk Bar</text>
  <text x="144" y="286" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="9">milkbarstore.com</text>
  <text x="88" y="326" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">Marca jugada, bundles y gifting.</text>
  <text x="88" y="344" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">La personalidad vende antes que</text>
  <text x="88" y="362" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">el producto.</text>
  <rect x="88" y="380" width="112" height="18" rx="9" fill="#FBE3EC"/>
  <text x="144" y="393" text-anchor="middle" fill="#84264D" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700">TOMAMOS: GIFTING</text>

  <g filter="url(#shadow)">
    <rect x="340" y="236" width="250" height="176" rx="20" fill="#FFF8F0" stroke="#E8D9D5"/>
  </g>
  <rect x="358" y="254" width="42" height="42" rx="12" fill="#A8C3A0"/>
  <text x="379" y="281" text-anchor="middle" fill="#2E4A2A" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">P</text>
  <text x="414" y="270" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700">Pophams</text>
  <text x="414" y="286" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="9">pophamsbakery.com</text>
  <text x="358" y="326" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">Editorial cálido, fotografía y</text>
  <text x="358" y="344" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">jerarquía simple. El producto</text>
  <text x="358" y="362" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">respira.</text>
  <rect x="358" y="380" width="122" height="18" rx="9" fill="#EEF4EA"/>
  <text x="419" y="393" text-anchor="middle" fill="#2E4A2A" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700">TOMAMOS: EDITORIAL</text>

  <g filter="url(#shadow)">
    <rect x="610" y="236" width="250" height="176" rx="20" fill="#FFF8F0" stroke="#E8D9D5"/>
  </g>
  <rect x="628" y="254" width="42" height="42" rx="12" fill="#FBE3EC"/>
  <text x="649" y="281" text-anchor="middle" fill="#84264D" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">C</text>
  <text x="684" y="270" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700">Crumbs &amp; Doilies</text>
  <text x="684" y="286" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="9">crumbsanddoilies.co.uk</text>
  <text x="628" y="326" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">Personalización clara, pasos</text>
  <text x="628" y="344" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">cortos y confianza en el oficio.</text>
  <text x="628" y="362" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10"> </text>
  <rect x="628" y="380" width="148" height="18" rx="9" fill="#F1E9F6"/>
  <text x="702" y="393" text-anchor="middle" fill="#6F4E92" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700">TOMAMOS: PERSONALIZACIÓN</text>

  <g filter="url(#shadow)">
    <rect x="890" y="236" width="440" height="326" rx="24" fill="#3A2633"/>
  </g>
  <text x="918" y="276" fill="#FBE3EC" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2">PERSONA / COMPRADORA</text>
  <circle cx="942" cy="328" r="26" fill="#C96A8A"/>
  <text x="942" y="335" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700">S</text>
  <text x="982" y="322" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700">Sofía, 29</text>
  <text x="982" y="342" fill="#C9A9B8" font-family="Arial, Helvetica, sans-serif" font-size="9">Diseñadora · Entre Ríos · Compra para regalar</text>
  <text x="918" y="382" fill="#FBE3EC" font-family="Arial, Helvetica, sans-serif" font-size="10">Necesita saber porciones, alérgenos y si llega a tiempo.</text>
  <text x="918" y="404" fill="#FBE3EC" font-family="Arial, Helvetica, sans-serif" font-size="10">Quiere que el regalo se vea tan lindo como el sabor.</text>
  <text x="918" y="426" fill="#FBE3EC" font-family="Arial, Helvetica, sans-serif" font-size="10">Le da tranquilidad reservar el retiro y pagar online.</text>
  <rect x="918" y="454" width="176" height="28" rx="14" fill="#4A3241"/>
  <text x="1006" y="472" text-anchor="middle" fill="#FBE3EC" font-family="Arial, Helvetica, sans-serif" font-size="8">FRASE: “Quiero que salga bien”.</text>
  <rect x="1106" y="454" width="196" height="28" rx="14" fill="#4A3241"/>
  <text x="1204" y="472" text-anchor="middle" fill="#FBE3EC" font-family="Arial, Helvetica, sans-serif" font-size="8">FRENO: dudas por WhatsApp</text>
  <text x="918" y="522" fill="#C9A9B8" font-family="Arial, Helvetica, sans-serif" font-size="9">5 entrevistas · 3 comercios · 1 mapa de empatía</text>

  <text x="70" y="470" fill="#84264D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2">INSIGHTS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="492" width="250" height="210" rx="20" fill="#FBE3EC"/>
  </g>
  <text x="90" y="530" fill="#B23A6B" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700">01</text>
  <text x="90" y="568" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700">Elegir para regalar</text>
  <text x="90" y="594" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">La decisión empieza por la</text>
  <text x="90" y="612" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">ocasión, no por el sabor.</text>
  <text x="90" y="630" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">Necesitamos filtros por</text>
  <text x="90" y="648" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">formato y cantidad.</text>
  <rect x="90" y="670" width="96" height="18" rx="9" fill="#FFFFFF" opacity=".55"/>
  <text x="138" y="683" text-anchor="middle" fill="#84264D" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700">REGALO</text>

  <g filter="url(#shadow)">
    <rect x="340" y="492" width="250" height="210" rx="20" fill="#F1E9F6"/>
  </g>
  <text x="360" y="530" fill="#6F4E92" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700">02</text>
  <text x="360" y="568" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700">Confiar en lo artesanal</text>
  <text x="360" y="594" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">Fotos reales, ingredientes</text>
  <text x="360" y="612" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">visibles y la historia de</text>
  <text x="360" y="630" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">quién lo hace.</text>
  <rect x="360" y="670" width="106" height="18" rx="9" fill="#FFFFFF" opacity=".55"/>
  <text x="413" y="683" text-anchor="middle" fill="#6F4E92" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700">TRANSPARENCIA</text>

  <g filter="url(#shadow)">
    <rect x="610" y="492" width="250" height="210" rx="20" fill="#FDF8F0"/>
  </g>
  <text x="630" y="530" fill="#A8841B" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700">03</text>
  <text x="630" y="568" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700">Reservar el retiro</text>
  <text x="630" y="594" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">Saber cuándo y dónde</text>
  <text x="630" y="612" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">retirar reduce la ansiedad</text>
  <text x="630" y="630" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">de comprar online.</text>
  <rect x="630" y="670" width="86" height="18" rx="9" fill="#FFFFFF" opacity=".55"/>
  <text x="673" y="683" text-anchor="middle" fill="#A8841B" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700">RETIRO</text>

  <rect x="70" y="746" width="1260" height="94" rx="20" fill="#FFF8F0" stroke="#E8D9D5"/>
  <text x="94" y="780" fill="#84264D" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2">PREGUNTA DE DISEÑO</text>
  <text x="94" y="812" fill="#2E2430" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">¿Cómo hacemos que elegir un postre para regalar sea tan simple como elegir un café?</text>
  <text x="1306" y="824" text-anchor="end" fill="#6E5A67" font-family="Arial, Helvetica, sans-serif" font-size="10">Casa Petunia · 2026</text>
</svg>
